<VirtualHost *:80>

    ServerName leaf.example.net
    ServerAlias leaf
    DocumentRoot /app/build
    HostnameLookups Off
    ErrorLog logs/leaf_ssl_error_log
    CustomLog logs/leaf_ssl_access_log combinedio

    #SSLEngine on
    #SSLProtocol all -SSLv2 -SSLv3
    #SSLHonorCipherOrder on
    #SSLCipherSuite HIGH:!aNULL:!MD5:!AECDH:!ADH
    #SSLCertificateFile /certs/{leaf-cert}.cert
    #SSLCertificateKeyFile /certs/private/{leaf-key}.key
    #SSLCertificateChainFile /etc/{cert-chain}.cert

    SetEnvIf User-Agent ".*MSIE.*" \
        nokeepalive ssl-unclean-shutdown \
        downgrade-1.0 force-response-1.0

    #<Files *.sso>
    #    SetHandler shib-handler
    #</Files>

    <Location />

      <RequireAny>

        # Optional subnet restriction
        Require ip 192.168
        Require ip 127.0.0.1

        # Authentication provider Setup
    #    AuthType shibboleth
    #    ShibRequireSession On
    #    ShibUseHeaders On
    #    Require shibboleth

        # optional users restriction, although this only determines access to the app, not a user's underlying authorization within the app
        # cat /data/leaf/users.conf --> leafusers: eppns...
    #    AuthGroupFile /data/leaf/users.conf
    #    require group leafusers

      </RequireAny>

    </Location>

    # API proxy directive, overall api doesn't require user session

    <Location /api>
      ProxyPass         http://leafapi:5001/api
      ProxyPassReverse  http://leafapi:5001/api

    #    <RequireAny>
    #        AuthType shibboleth
    #        ShibRequireSession Off 
    #        Require shibboleth
    #     </RequireAny>

    </Location>

  # /api/user does require user session
  #  <Location /api/user>
  #       <RequireAny>
  #             AuthType shibboleth
  #             ShibRequireSession On
  #             Require shibboleth
  #       </RequireAny>
  # </Location>

</VirtualHost>