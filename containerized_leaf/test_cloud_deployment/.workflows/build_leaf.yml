name: Build Non-Prod Leaf Environment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'test'

jobs:
  build_leaf:
    runs-on: [self-hosted, leaf]
    environment: test
    steps:
      - name: Check out the repository to the runner
        uses: actions/checkout@v5
      - name: Fix Preparation Script Permissions
        run: chmod +x prepare_cicd_compose.sh
      - name: Run Preparation Script to Download Leaf and Distribute Customized Files
        run: ./prepare_cicd_compose.sh
      - name: Docker Compose Build API Container
        run: docker compose -f apionly-compose.yml build leaf_api
      - name: Docker Compose Web Container
        run: docker compose -f apionly-compose.yml build leaf_web
      - name: Start API Container 
        run: docker compose -f apionly-compose.yml up -d leaf_api
      - name: Start Web Container 
        run: docker compose -f apionly-compose.yml up -d leaf_api
    env:
      LEAF_APP_DB: ${{ secrets.LEAF_APP_DB }}
      LEAF_CLIN_DB: ${{ secrets.LEAF_CLIN_DB }}
      LEAF_JWT_KEY_PW: ${{ secrets.LEAF_JWT_KEY_PW }}